<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Inner Badge / Shield -->
  <rect x="76" y="76" width="360" height="360" rx="44" fill="#1e293b" stroke="#334155" stroke-width="4" filter="url(#shadow)" />

  <!-- Accent Emblem: Document / Building / Charts & Checkmark -->
  <g transform="translate(116, 116)">
    <!-- Base Document Card -->
    <rect x="20" y="20" width="240" height="240" rx="28" fill="url(#emeraldGrad)" />

    <!-- Document Lines / Business Details -->
    <rect x="50" y="60" width="100" height="14" rx="7" fill="#ffffff" opacity="0.95" />
    <rect x="50" y="90" width="180" height="12" rx="6" fill="#ffffff" opacity="0.75" />
    <rect x="50" y="116" width="140" height="12" rx="6" fill="#ffffff" opacity="0.75" />

    <!-- Financial / Chart Bars -->
    <rect x="50" y="190" width="24" height="40" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="86" y="160" width="24" height="70" rx="6" fill="#ffffff" opacity="0.95" />
    <rect x="122" y="140" width="24" height="90" rx="6" fill="#ffffff" opacity="1" />

    <!-- Approved / Check badge -->
    <circle cx="210" cy="200" r="38" fill="#0f172a" stroke="#10b981" stroke-width="6" />
    <path d="M196 200 L206 210 L226 190" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
